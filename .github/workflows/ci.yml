name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  cc: gcc }
          - { os: ubuntu-latest,  cc: clang }
          - { os: macos-latest,   cc: clang }
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make CC=${{ matrix.cc }} EXTRA_CFLAGS=-Werror

      # The unit tests, both gradient checks and both quantiser checks. No
      # dataset needed: every fixture is synthesised, including the 784x784
      # Hessian, so this job is hermetic and fast.
      - name: Tests, gradient check and quantiser check
        run: make CC=${{ matrix.cc }} EXTRA_CFLAGS=-Werror check

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests under AddressSanitizer and UndefinedBehaviorSanitizer
        run: make CC=clang sanitize

  end-to-end:
    name: Dataset fetch and one epoch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Cache MNIST
        uses: actions/cache@v4
        with:
          path: dataset
          key: mnist-idx-v1

      # Also the test that scripts/get_dataset.sh still works: if a mirror
      # disappears or serves something else, the checksums fail here rather
      # than in someone's clone.
      - name: Fetch and verify the dataset
        run: ./scripts/get_dataset.sh

      - name: Build
        run: make EXTRA_CFLAGS=-Werror

      - name: Train one epoch and score the validation split
        run: ./mnist train --epochs 1 --weights ci-network.dat

      # C1 and C2 again, this time on a Hessian built from the real training
      # images rather than the synthetic stand-in the hermetic job uses.
      - name: Cholesky and inverse on the real MNIST Hessian
        run: make EXTRA_CFLAGS=-Werror build/quantcheck64 && ./build/quantcheck64 --data dataset

      # And the quantiser end to end, so a driver that no longer runs fails here
      # rather than the next time someone reproduces a table.
      - name: Quantise the one-epoch network
        run: |
          make EXTRA_CFLAGS=-Werror quant
          ./build/quant_sweep --weights ci-network.dat --out runs/ci \
              --calib 256 --bits 8,4 --method rtn,gptq --no-save
